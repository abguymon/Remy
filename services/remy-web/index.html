<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Remy turns the meals you want to cook into a reviewed, ready-to-shop grocery cart."
    />
    <meta property="og:title" content="Remy — Meals in. Groceries out." />
    <meta
      property="og:description"
      content="Plan meals, pick recipes, review the grocery list, and add the right products to your cart."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Remy — Meals in. Groceries out." />
    <meta
      name="twitter:description"
      content="A private weeknight helper that turns dinner ideas into a reviewed grocery cart."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="icon" type="image/svg+xml" href="/rat.svg" />
    <title>Remy — Meals in. Groceries out.</title>
    <meta name="theme-color" content="#F6F0E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16120F" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved appearance before first paint (mirrors src/stores/theme.ts).
      try {
        var p = localStorage.getItem('remy-theme') || 'system'
        if (p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
